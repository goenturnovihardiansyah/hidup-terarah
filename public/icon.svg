<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24284A"/>
      <stop offset="100%" stop-color="#15172A"/>
    </linearGradient>
    <linearGradient id="needle-n" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7B66"/>
      <stop offset="100%" stop-color="#F06A55"/>
    </linearGradient>
    <linearGradient id="needle-s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C55A"/>
      <stop offset="100%" stop-color="#E0A21B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- Compass Ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#FFFCF8" stroke-opacity="0.18" stroke-width="8"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#FFFCF8" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Cardinal points / Ticks -->
  <circle cx="256" cy="92" r="5" fill="#F06A55"/>
  <circle cx="256" cy="420" r="5" fill="#E0A21B"/>
  <circle cx="92" cy="256" r="4" fill="#FFFCF8" fill-opacity="0.3"/>
  <circle cx="420" cy="256" r="4" fill="#FFFCF8" fill-opacity="0.3"/>

  <!-- Needle with Shadow -->
  <g filter="url(#shadow)">
    <!-- North Needle (Coral) -->
    <path d="M 256 104 L 308 256 L 256 256 Z" fill="#F06A55"/>
    <path d="M 256 104 L 204 256 L 256 256 Z" fill="#FF8A75"/>

    <!-- South Needle (Butter) -->
    <path d="M 256 408 L 308 256 L 256 256 Z" fill="#E0A21B"/>
    <path d="M 256 408 L 204 256 L 256 256 Z" fill="#F5C55A"/>
  </g>

  <!-- Center Pivot Ring & Core -->
  <circle cx="256" cy="256" r="28" fill="#1E2242"/>
  <circle cx="256" cy="256" r="28" fill="none" stroke="#FFFCF8" stroke-width="5"/>
  <circle cx="256" cy="256" r="10" fill="#FFFCF8"/>
</svg>
